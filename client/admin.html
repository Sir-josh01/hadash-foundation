<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hadash Foundation - Admin Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

    <!-- Navigation Header -->
    <header class="bg-emerald-700 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">Hadash CMS Dashboard</h1>
            <button id="logoutBtn" class="hidden bg-emerald-800 px-3 py-1 rounded text-sm hover:bg-emerald-900 transition">Logout</button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">
        
        <!-- LOGIN SECTION -->
        <section id="loginSection" class="bg-white p-8 rounded-xl shadow-md max-w-md mx-auto mt-10">
            <h2 class="text-2xl font-bold mb-6 text-gray-800 text-center">Admin Login</h2>
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                    <input type="email" id="loginEmail" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="loginPassword" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <button type="submit" class="w-full bg-emerald-600 text-white py-2 rounded-lg font-semibold hover:bg-emerald-700 transition">Login</button>
            </form>
            <p id="loginError" class="text-red-500 text-sm mt-3 text-center hidden"></p>
        </section>

        <!-- DASHBOARD / POST FORM SECTION (Hidden until logged in) -->
        <section id="dashboardSection" class="hidden bg-white p-8 rounded-xl shadow-md">
            <h2 class="text-2xl font-bold mb-6 text-gray-800">Publish School Outreach Report</h2>
            
            <form id="outreachForm" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Post Title</label>
                        <input type="text" id="title" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">School Name</label>
                        <input type="text" id="schoolName" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Location</label>
                        <input type="text" id="location" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Category</label>
                        <input type="text" id="category" placeholder="e.g. STEM Workshop" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Students Impacted</label>
                        <input type="number" id="studentsImpacted" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Event Date</label>
                    <input type="date" id="eventDate" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Short Summary</label>
                    <textarea id="summary" rows="2" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Full Story</label>
                    <textarea id="story" rows="4" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Upload Images (Max 5)</label>
                    <input type="file" id="images" multiple accept="image/*" class="w-full px-4 py-2 border rounded-lg bg-gray-50">
                </div>

                <button type="submit" class="w-full bg-emerald-600 text-white py-3 rounded-lg font-semibold hover:bg-emerald-700 transition">Publish Outreach Report</button>
            </form>
            <p id="formMessage" class="mt-4 text-center text-sm font-medium hidden"></p>
        </section>

    </main>

    <!-- Frontend Logic Script -->
    <script>
        const loginSection = document.getElementById('loginSection');
        const dashboardSection = document.getElementById('dashboardSection');
        const loginForm = document.getElementById('loginForm');
        const loginError = document.getElementById('loginError');
        const logoutBtn = document.getElementById('logoutBtn');
        const outreachForm = document.getElementById('outreachForm');
        const formMessage = document.getElementById('formMessage');

        // Check if already logged in on page load
        const token = localStorage.getItem('adminToken');
        if (token) {
            loginSection.classList.add('hidden');
            dashboardSection.classList.remove('hidden');
            logoutBtn.classList.remove('hidden');
        }

        // Handle Login Submission
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            loginError.classList.add('hidden');
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    localStorage.setItem('adminToken', data.token);
                    loginSection.classList.add('hidden');
                    dashboardSection.classList.remove('hidden');
                    logoutBtn.classList.remove('hidden');
                } else {
                    loginError.textContent = data.message || 'Invalid credentials';
                    loginError.classList.remove('hidden');
                }
            } catch (err) {
                loginError.textContent = 'Server connection error';
                loginError.classList.remove('hidden');
            }
        });

        // Handle Logout
        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('adminToken');
            location.reload();
        });

        // Handle Outreach Post & Cloudinary Upload
        outreachForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            formMessage.classList.add('hidden');

            const formData = new FormData();
            formData.append('title', document.getElementById('title').value);
            formData.append('schoolName', document.getElementById('schoolName').value);
            formData.append('location', document.getElementById('location').value);
            formData.append('category', document.getElementById('category').value);
            formData.append('studentsImpacted', document.getElementById('studentsImpacted').value);
            formData.append('eventDate', document.getElementById('eventDate').value);
            formData.append('summary', document.getElementById('summary').value);
            formData.append('story', document.getElementById('story').value);

            const imageFiles = document.getElementById('images').files;
            for (let i = 0; i < imageFiles.length; i++) {
                formData.append('images', imageFiles[i]);
            }

            try {
                const res = await fetch('/api/outreaches', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('adminToken')}`
                    },
                    body: formData
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    formMessage.textContent = 'School visit report published successfully!';
                    formMessage.className = 'mt-4 text-center text-sm font-medium text-emerald-600';
                    formMessage.classList.remove('hidden');
                    outreachForm.reset();
                } else {
                    formMessage.textContent = data.message || 'Failed to publish post';
                    formMessage.className = 'mt-4 text-center text-sm font-medium text-red-600';
                    formMessage.classList.remove('hidden');
                }
            } catch (err) {
                formMessage.textContent = 'Error connecting to server';
                formMessage.className = 'mt-4 text-center text-sm font-medium text-red-600';
                formMessage.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
